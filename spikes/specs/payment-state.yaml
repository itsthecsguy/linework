type: state
title: Payment lifecycle
direction: auto
nodes:
  init:       { kind: start }
  created:    { label: Created }
  authorizing: { label: Authorizing }
  authorized: { label: Authorized }
  captured:   { label: Captured, kind: final }
  failed:     { label: Failed, kind: error }
  voided:     { label: Voided }
  refunded:   { label: Refunded }
  fin:        { kind: end }
edges:
  - init -> created
  - created -> authorizing: submit
  - authorizing -> authorized: approved
  - authorizing -> failed: declined
  - authorized -> captured: capture
  - authorized -> voided: void
  - captured -> refunded: refund
  - failed -> created: retry
  - captured -> fin
  - voided -> fin
  - refunded -> fin
